---
# NOTE: Do not derive this from ansible_facts.python.executable. When the
# deployment host is also a target (ansible_connection=local) and Kolla Ansible
# runs from a virtualenv, that fact is the venv interpreter. Because this
# variable is templated, delegated tasks (delegated fact gathering, nova cell
# discovery, the nova-cell libvirt version check) resolve it in the delegating
# host's context and then try to execute that path on the delegation target,
# where it does not exist:
#   "/home/<user>/<venv>/bin/python3.13: not found", rc=127
# 'auto_silent' lets interpreter discovery run against whichever host actually
# executes the module. The virtualenv branch is kept for the documented
# target-side virtualenv feature.
ansible_python_interpreter: >-
  {{
    virtualenv ~ '/bin/python'
    if virtualenv is defined
      and virtualenv is not none
      and virtualenv | length > 0
    else 'auto_silent'
  }}
