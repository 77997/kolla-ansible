---
- name: Ensuring config directories exist
  ansible.builtin.file:
    path: "{{ node_config_directory }}/{{ item.key }}"
    state: "directory"
    owner: "{{ config_owner_user }}"
    group: "{{ config_owner_group }}"
    mode: "0770"
  become: true
  with_dict: "{{ aci_aim_services | select_services_enabled_and_mapped_to_host }}"

- name: Copying over config.json files for services
  ansible.builtin.template:
    src: "{{ item.key }}.json.j2"
    dest: "{{ node_config_directory }}/{{ item.key }}/config.json"
    mode: "0660"
  become: true
  with_dict: "{{ aci_aim_services | select_services_enabled_and_mapped_to_host }}"

- name: Copying over aim.conf
  vars:
    service_name: "{{ item.key }}"
  merge_configs:
    sources:
      - "{{ role_path }}/templates/aim.conf.j2"
      - "{{ node_custom_config }}/aci-aim/aim.conf"
      - "{{ node_custom_config }}/aci-aim/{{ inventory_hostname }}/aim.conf"
    dest: "{{ node_config_directory }}/{{ item.key }}/aim.conf"
    mode: "0660"
  become: true
  with_dict: "{{ aci_aim_services | select_services_enabled_and_mapped_to_host }}"
