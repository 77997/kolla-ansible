---
- name: Load and persist br_netfilter module
  ansible.builtin.include_role:
    name: module-load
  vars:
    modules:
      - { name: br_netfilter }
  when:
    - inventory_hostname in groups[nova_cell_compute_group]

- name: Enable bridge-nf-call sysctl variables
  become: true
  ansible.posix.sysctl:
    name: "{{ item }}"
    state: present
    value: "1"
    sysctl_set: true
    sysctl_file: "{{ kolla_sysctl_conf_path }}"
  loop:
    - net.bridge.bridge-nf-call-iptables
    - net.bridge.bridge-nf-call-ip6tables
  when:
    - set_sysctl | bool
    - inventory_hostname in groups[nova_cell_compute_group]

# NOTE(yoctozepto): Part of bug #1681461 fix.
# This part can actually run on any distro and lets us drop the hardcoded
# chown and chmod from the nova-libvirt image extend_start and make the process
# more robust.
- name: Install udev kolla kvm rules
  become: true
  ansible.builtin.template:
    src: "99-kolla-kvm.rules.j2"
    dest: "/etc/udev/rules.d/99-kolla-kvm.rules"
    mode: "0644"
  when:
    - enable_nova_libvirt_container | bool
    - nova_compute_virt_type == 'kvm'
    - inventory_hostname in groups[nova_cell_compute_group]

# NOTE(yoctozepto): Part of bug #1681461 fix.
# This part only really makes sense on Ubuntu and would end up being confusing
# on others. This service changes /dev/kvm permissions.
- name: Mask qemu-kvm service
  become: true
  ansible.builtin.systemd:
    name: qemu-kvm.service
    masked: true
  when:
    - enable_nova_libvirt_container | bool
    - nova_compute_virt_type == 'kvm'
    - ansible_facts.distribution == 'Ubuntu'
    - inventory_hostname in groups[nova_cell_compute_group]

# NOTE: POWER8 KVM-HV only runs guests in whole-core mode. Without this the host
# boots fine but every instance fails to start. Deliberately a systemd unit and
# not smt-enabled=off, which deadlocks powernv's subcore_init() at boot.
- name: Install POWER8 SMT-off unit
  become: true
  ansible.builtin.template:
    src: "kolla-smt-off.service.j2"
    dest: "/etc/systemd/system/kolla-smt-off.service"
    mode: "0644"
  register: kolla_smt_off_unit
  when:
    - nova_compute_disable_smt | bool
    - nova_compute_virt_type == 'kvm'
    - inventory_hostname in groups[nova_cell_compute_group]

- name: Enable and start POWER8 SMT-off unit
  become: true
  ansible.builtin.systemd:
    name: kolla-smt-off.service
    enabled: true
    state: "{{ 'restarted' if kolla_smt_off_unit.changed else 'started' }}"
    daemon_reload: true
  when:
    - nova_compute_disable_smt | bool
    - nova_compute_virt_type == 'kvm'
    - inventory_hostname in groups[nova_cell_compute_group]
