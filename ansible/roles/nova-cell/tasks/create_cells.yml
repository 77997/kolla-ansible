---
- name: Import tasks from get_cell_settings.yml
  ansible.builtin.import_tasks: get_cell_settings.yml
  when:
    - inventory_hostname == groups[nova_conductor.group][0] | default(None)

- name: Create cell
  vars:
    nova_conductor: "{{ nova_cell_services['nova-conductor'] }}"
  become: true
  kolla_container:
    action: "start_container"
    command: >-
      bash -c 'sudo -E kolla_set_configs &&
      sudo kolla_copy_cacerts &&
      nova-manage cell_v2 create_cell{% if nova_cell_name %} --name {{ nova_cell_name }}{% endif %}'
    common_options: "{{ docker_common_options }}"
    detach: false
    image: "{{ nova_conductor.image }}"
    labels:
      BOOTSTRAP:
    name: "create_cell_nova"
    restart_policy: oneshot
    volumes: "{{ nova_cell_bootstrap_default_volumes + nova_cell_bootstrap_extra_volumes }}"
  register: nova_cell_create
  changed_when:
    - nova_cell_create is success
  failed_when:
    - nova_cell_create.rc != 0
    - '"already exists" not in nova_cell_create.stdout'
  when:
    - inventory_hostname == groups[nova_conductor.group][0] | default(None)
    # NOTE: test the dict's length, not "| bool" and not bare truthiness.
    # "| bool" does not implement Python truthiness - it only recognises
    # yes/true/1-style values and coerces any dict to False, so the condition
    # would always be False and a changed cell transport_url / database
    # connection would silently never be applied. A bare dict is right about
    # truthiness but is not a boolean, which ansible-core 2.19 rejects outright:
    #   Conditional result (True) was derived from value of type 'dict'
    # nova_cell_settings is {} when the cell does not exist yet.
    - nova_cell_settings | length == 0

- name: Update cell
  vars:
    nova_cell_database_url: "mysql+pymysql://{{ nova_cell_database_user }}:{{ nova_cell_database_password }}@\
      {{ nova_cell_database_address | put_address_in_context('url') }}:{{ nova_cell_database_port }}/{{ nova_cell_database_name }}"
    nova_conductor: "{{ nova_cell_services['nova-conductor'] }}"
  become: true
  kolla_container:
    action: "start_container"
    command: >-
      bash -c 'sudo -E kolla_set_configs &&
      sudo kolla_copy_cacerts &&
      nova-manage cell_v2 update_cell --cell_uuid {{ nova_cell_settings.cell_uuid }}'
    common_options: "{{ docker_common_options }}"
    detach: false
    image: "{{ nova_conductor.image }}"
    labels:
      BOOTSTRAP:
    name: "create_cell_nova"
    restart_policy: oneshot
    volumes: "{{ nova_cell_bootstrap_default_volumes + nova_cell_bootstrap_extra_volumes }}"
  register: nova_cell_updated
  changed_when:
    - nova_cell_updated is success
  failed_when:
    - nova_cell_updated.rc != 0
  when:
    - inventory_hostname == groups[nova_conductor.group][0] | default(None)
    - nova_cell_settings | length > 0
    - nova_cell_settings.cell_message_queue != nova_cell_rpc_transport_url or nova_cell_settings.cell_database != nova_cell_database_url
