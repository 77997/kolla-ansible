---
# NOTE: Nothing here acts on the running host. ipmi_watchdog is loaded by the
# openipmi service and systemd reads system.conf.d when they start, so the
# watchdog takes effect at the host's next boot.
- name: Check openipmi configuration file
  become: true
  ansible.builtin.stat:
    path: "/etc/default/openipmi"
  register: host_watchdog_openipmi_default

- name: Fail if openipmi is not installed
  ansible.builtin.fail:
    msg: >-
      /etc/default/openipmi does not exist on {{ inventory_hostname }}. The
      BMC watchdog is loaded by the openipmi service: install openipmi first.
  when:
    - not host_watchdog_openipmi_default.stat.exists

- name: Check openipmi service is enabled  # noqa command-instead-of-module
  become: true
  ansible.builtin.command: systemctl is-enabled openipmi.service
  register: host_watchdog_openipmi_enabled
  changed_when: false
  failed_when: false
  check_mode: false

- name: Fail if openipmi service is not enabled
  ansible.builtin.fail:
    msg: >-
      openipmi.service is not enabled on {{ inventory_hostname }}
      ({{ host_watchdog_openipmi_enabled.stdout or
      host_watchdog_openipmi_enabled.stderr }}), so
      ipmi_watchdog would not be loaded at boot.
  when:
    - host_watchdog_openipmi_enabled.rc != 0

- name: Load ipmi_watchdog through openipmi at boot
  become: true
  ansible.builtin.lineinfile:
    path: "/etc/default/openipmi"
    regexp: "^IPMI_WATCHDOG="
    line: "IPMI_WATCHDOG=yes"

- name: Ensure systemd manager configuration directory exists
  become: true
  ansible.builtin.file:
    path: "/etc/systemd/system.conf.d"
    state: directory
    mode: "0755"

- name: Configure systemd to feed the BMC watchdog
  become: true
  ansible.builtin.template:
    src: "systemd-watchdog.conf.j2"
    dest: "/etc/systemd/system.conf.d/90-watchdog.conf"
    mode: "0644"

# NOTE: On x86_64 the chipset watchdog, iTCO_wdt, registers before
# ipmi_watchdog and takes /dev/watchdog0, which systemd feeds. It is loaded
# from the initramfs, so the initramfs of the running kernel is rebuilt with
# the blacklist in it.
- name: Blacklist the chipset watchdog
  become: true
  ansible.builtin.template:
    src: "modprobe-watchdog.conf.j2"
    dest: "/etc/modprobe.d/90-watchdog.conf"
    mode: "0644"
  notify:
    - Update initramfs
  when:
    - ansible_facts.architecture == 'x86_64'
