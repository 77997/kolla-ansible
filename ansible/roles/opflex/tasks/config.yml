---
# NOTE: asserted here rather than only in precheck.yml because prechecks are
# a separate command that deploy does not run, and a missing uplink silently
# renders an agent config that can never bring up a tunnel endpoint.
- name: Checking the OpFlex uplink is configured
  ansible.builtin.assert:
    that: opflex_uplink_interface | length > 0
    fail_msg: >-
      opflex_uplink_interface must name the interface facing the ACI leaf on
      {{ inventory_hostname }}. Set it per host in the inventory, or in
      globals.yml when every OpFlex host is cabled the same way.
  when: inventory_hostname in groups['compute']

- name: Ensuring config directories exist
  ansible.builtin.file:
    path: "{{ node_config_directory }}/{{ item.key }}"
    state: "directory"
    owner: "{{ config_owner_user }}"
    group: "{{ config_owner_group }}"
    mode: "0770"
  become: true
  with_dict: "{{ opflex_services | select_services_enabled_and_mapped_to_host }}"

- name: Copying over config.json files for services
  ansible.builtin.template:
    src: "{{ item.key }}.json.j2"
    dest: "{{ node_config_directory }}/{{ item.key }}/config.json"
    mode: "0660"
  become: true
  with_dict: "{{ opflex_services | select_services_enabled_and_mapped_to_host }}"

- name: Copying over opflex_agent.ini
  vars:
    service: "{{ opflex_services['opflex-agent'] }}"
  merge_configs:
    sources:
      - "{{ role_path }}/templates/opflex_agent.ini.j2"
      - "{{ node_custom_config }}/opflex/opflex_agent.ini"
      - "{{ node_custom_config }}/opflex/{{ inventory_hostname }}/opflex_agent.ini"
    dest: "{{ node_config_directory }}/opflex-agent/opflex_agent.ini"
    mode: "0660"
  become: true
  when: service | service_enabled_and_mapped_to_host

- name: Copying over neutron.conf for opflex
  vars:
    service: "{{ opflex_services['opflex-agent'] }}"
  merge_configs:
    sources:
      - "{{ node_custom_config }}/neutron.conf"
      - "{{ node_custom_config }}/neutron/{{ inventory_hostname }}/neutron.conf"
    dest: "{{ node_config_directory }}/opflex-agent/neutron.conf"
    mode: "0660"
  become: true
  when: service | service_enabled_and_mapped_to_host

- name: Copying over opflex drop-log config
  vars:
    service: "{{ opflex_services['opflex-agent'] }}"
  ansible.builtin.template:
    src: "opflex_droplog.conf.j2"
    dest: "{{ node_config_directory }}/opflex-agent/opflex_droplog.conf"
    mode: "0660"
  become: true
  when:
    - service | service_enabled_and_mapped_to_host
    - enable_neutron_packet_logging | default(false) | bool

# NOTE: the agent-ovs configuration is JSON, so it is templated rather than
# merged. Everything in it is driven by an opflex_* variable; anything that
# still needs overriding can be dropped into the agent's conf.d as a
# higher-numbered file, which agent-ovs merges over this one.
- name: Copying over opflex-agent-ovs.conf
  vars:
    service: "{{ opflex_services['opflex-agent-ovs'] }}"
  ansible.builtin.template:
    src: "opflex-agent-ovs.conf.j2"
    dest: "{{ node_config_directory }}/opflex-agent-ovs/opflex-agent-ovs.conf"
    mode: "0660"
  become: true
  when: service | service_enabled_and_mapped_to_host
