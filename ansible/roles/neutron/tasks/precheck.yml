---
- import_role:
    name: service-precheck
  vars:
    service_precheck_services: "{{ neutron_services }}"
    service_name: "{{ project_name }}"

- name: Get container facts
  become: true
  kolla_container_facts:
    action: get_containers
    container_engine: "{{ kolla_container_engine }}"
    name:
      - neutron_server
  check_mode: false
  register: container_facts

- name: Checking free port for Neutron Server
  wait_for:
    host: "{{ api_interface_address }}"
    port: "{{ neutron_server_listen_port }}"
    connect_timeout: 1
    timeout: 1
    state: stopped
  when:
    - container_facts.containers['neutron_server'] is not defined
    - inventory_hostname in groups['neutron-server']

- name: Checking number of network agents
  assert:
    that:
      - groups['neutron-dhcp-agent'] | length > 1
      - groups['neutron-l3-agent'] | length > 1
    fail_msg: "Number of network agents are less than two when enabling agent ha"
  changed_when: false
  run_once: True
  when:
    - enable_neutron_agent_ha | bool

- name: Checking tenant network types
  assert:
    that: item in type_drivers
    fail_msg: "Tenant network type '{{ item }}' is not in type drivers [{{ neutron_type_drivers }}]"
  with_items: "{{ tenant_network_types }}"
  vars:
    type_drivers: "{{ neutron_type_drivers.replace(' ', '').split(',') | reject('equalto', '') | list }}"
    tenant_network_types: "{{ neutron_tenant_network_types.replace(' ', '').split(',') | reject('equalto', '') | list }}"
  run_once: true

- name: Checking whether Ironic enabled
  assert:
    that: enable_ironic | bool
    fail_msg: "Ironic must be enabled when using networking-baremetal/ironic-neutron-agent"
  run_once: True
  when:
    - enable_ironic_neutron_agent | bool

- name: Checking if neutron's dns domain has proper value
  assert:
    that:
      - neutron_dns_domain != None
      - neutron_dns_domain | length != 0
      - neutron_dns_domain[-1] == '.'
      - neutron_dns_domain != "openstacklocal"
    fail_msg: "The neutron_dns_domain value has to be non-empty and must end with a period '.'"
  changed_when: false
  run_once: True
  when:
    - neutron_dns_integration | bool

- name: Checking for ACI-incompatible features
  assert:
    that:
      - not (enable_neutron_dvr | bool)
      - not (enable_neutron_bgp_dragent | bool)
      - not (enable_neutron_agent_ha | bool)
      - not (enable_neutron_segments | bool)
      - not (enable_neutron_provider_networks | bool)
      - not (enable_neutron_mlnx | bool)
      - not (enable_neutron_infoblox_ipam_agent | bool)
    fail_msg: >-
      One or more enabled features cannot work with ACI. The fabric routes
      and advertises natively, so DVR and BGP dynamic routing have nothing to
      distribute, and apic_aim_l3 schedules no router to an agent, which also
      makes L3 agent HA meaningless. apic_aim maps a network to exactly one
      bridge domain and EPG, so routed provider networks collapse into a
      single flood domain. Provider networks would build br-ex on the compute
      nodes and take the OpFlex uplink with it, and no ACI object corresponds
      to an InfiniBand partition. networking-infoblox is in neither image.
      Set enable_neutron_dvr, enable_neutron_bgp_dragent,
      enable_neutron_agent_ha, enable_neutron_segments,
      enable_neutron_provider_networks, enable_neutron_mlnx and
      enable_neutron_infoblox_ipam_agent to "no".
  run_once: true
  when:
    - neutron_plugin_agent == 'aci'

# NOTE: neutron-server writes <opflex_drop_log_dir>/<host>/openstack.droplogcfg
# and the OpFlex agent reads it on the compute node, so the default, which is
# the compute-local state directory, only works when the two are the same host.
# Anywhere else the driver writes files nobody reads and the logging API
# silently does nothing, which is worse than refusing to deploy.
- name: Checking the OpFlex drop-log directory is shared for packet logging
  ansible.builtin.assert:
    that: opflex_drop_log_dir != (opflex_agent_ovs_state_dir ~ '/droplog')
    fail_msg: >-
      enable_neutron_packet_logging needs opflex_drop_log_dir to name storage
      that both neutron-server and every compute node can see, because the
      driver writes per-host drop-log configuration on the controller and the
      OpFlex agent reads it on the compute. It is still at the compute-local
      default, which cannot work with a separate compute node.
  run_once: true
  when:
    - neutron_plugin_agent == 'aci'
    - enable_neutron_packet_logging | bool
    - groups['compute'] | difference(groups['neutron-server']) | length > 0

- import_tasks: neutron_plugin_agent_check.yml
